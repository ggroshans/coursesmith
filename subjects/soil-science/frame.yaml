subject: soil-science
status: 'reviewed 2026-11-16 (review pass for the owner; the pilot chapter reviewed 2026-11-15). Merged the ''other topics''
  chapters, moved misplaced seeds, dropped single taxa, soil series, journals and engineering tools, pinned the founders.
  Re-review freely. Targets set 2026-11-16 to what each chapter''s sources supported after consolidation (1,666 in all).
  Curriculum review 2026-11-16: Water in soil moved into Soil physics, Horizons before How soils form, Redox before Acidity,
  farming systems open the agriculture part; Permafrost moved to Soil temperature and air, and soil health, functions
  and quality to Foundations. Discovery 2026-11-16: thirteen chapters added from the syllabus plan (a new part, Studying
  soil: methods and mapping), and pages the scope judge and the syllabus placed added as seeds. Order review 2026-11-16:
  the methods part moved after Agriculture (its entries build on soil tests and soil survey); Forest and rangeland soils
  dissolved into weathering, degradation and soil survey.'
note: 'Edit freely: reorder parts and chapters, move seeds, rename. Seeds are forced into the crawl; candidates are crawled
  only if they pass the scope threshold. `share` is the chapter''s share of the entry target.'
