hubs:
  navboxes: [Template:Soil science topics]
  index: Index of soil-related articles
  vital: [Wikipedia:Vital articles/Level 4/Physical sciences#Pedology,
          Wikipedia:Vital articles/Level 5/Physical sciences/Earth science#Soil science]
  wikiproject: Soil
categories:
  roots: [Category:Soil science]
  depth: 2
  exclude: [Category:Soil scientists, Category:Soil science journals, Category:Soil by country,
            Category:Fertilizer companies, Category:Fictional characters with earth or stone abilities,
            Category:Sample return missions, Category:Geophagia, Category:Superfund sites]
scope:
  include_terms: [soil, pedo, humus, loam, clay, silt, horizon, weathering, erosion, fertility, tillage]
  exclude_terms: [company, university, award, fictional, song, album]
  person_terms: [pedologist, agronomist, soil scientist]
  # Short descriptions that mark a page as outside the course (people other than founders, books, bodies,
  # places, software, single microbial taxa). Founders are pinned in the frame, so they stay in.
  exclude_desc: [book, city in, town in, organisation, organization, government agency, non-profit, foundation,
                 board, commission, institute, model, software, family of bacteria, genus of bacteria,
                 species of bacteria, family of woodlice, soil scientist, pedologist, microbiologist, educationist,
                 politician, historian, chemist, engineering technique, wastewater, trademark, used to treat]
# per_unit is the unit size; the course runs as many units as the entries need. No entry target: every
# entry that passes the curriculum test is kept.
targets: {per_unit: [4, 5]}
ordering: pedagogical
edition: {images: true, questions: true, proportional_clock: false}
verification:
  works: openalex
  authorities:
    # Live: the Soil Survey Manual's chapter on soil properties (texture, structure, consistence), the soil
    # survey glossary, the Keys to Soil Taxonomy and the WRB (both only for Classification entries: a long manual
    # matched against every entry gives false numeric hits). Pending (no fetcher): SoilGrids, which is a dataset.
    - name: USDA NRCS Soil Survey Manual
      kind: classification
      fetcher: text_reference
      urls: [https://www.nrcs.usda.gov/sites/default/files/2022-09/SSM-ch3.pdf]
    - name: USDA NRCS soil survey glossary
      kind: classification
      fetcher: text_reference
      urls: [https://www.nrcs.usda.gov/sites/default/files/2022-08/A_Glossary_of_Terms_Used_in_Soil_Survey_and_Classification.pdf]
    - name: USDA NRCS Keys to Soil Taxonomy
      kind: classification
      fetcher: text_reference
      kinds: [Classification]
      urls: [https://www.nrcs.usda.gov/sites/default/files/2022-09/Keys-to-Soil-Taxonomy.pdf]
    - name: IUSS World Reference Base for Soil Resources
      kind: classification
      fetcher: text_reference
      kinds: [Classification]
      urls: [https://www.isric.org/sites/default/files/WRB_fourth_edition_2022-12-18.pdf]
    - {name: ISRIC SoilGrids, kind: numeric}

