slug: soil-science
title: Soil Science
short: soil
description: >-
  Soil science from the ground up: what soil is, how it forms, its physics, chemistry and life, how it is
  classified, how it feeds plants, how water moves and erodes it, how farmers manage it, and what it means
  for the environment and the climate. Ordered from foundational to advanced, sourced from Wikipedia.
seeds: [Soil science, Soil]
# Sources besides Wikipedia (always on); licenses were read from each source by the search session.
