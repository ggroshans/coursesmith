slug: system-design
title: "System design interview questions, beginner to advanced"
short: sysd   # prefix for entry ids: sysd-<chapter>-001
description: >-
  System design from the ground up, through the questions interviews actually ask. It starts with how networks, storage and
  caches work, builds up through scaling, consistency, messaging and reliability, and then answers the classic design
  questions (a URL shortener, a pastebin, a chat service, a social feed, a video service, a ride-hailing service, a web
  crawler) step by step: requirements, estimates, data model, interfaces, components and bottlenecks. Every fact comes
  from Wikipedia, the IETF's RFCs, original research papers or the openly licensed guides credited on each page.

# survey: a course that covers a field. questions: each chapter of a part marked `question: true` is one question
# answered by one Worked example entry, plus the concepts a good answer needs.
course_type: questions
# personal: this course is for the owner's own reading, so sources with NonCommercial / NoDerivatives licenses are fine
# (they are attributed on every page). Change to `public` and `publish check` will refuse them.
distribution: personal

# Pages the crawl always fetches besides the frame's. The frame (frame.yaml, built from `frame:` below) names the rest.
seeds: ["Systems design", "Consistent hashing"]

# Sources besides Wikipedia (always on). `coursesmith sources check system-design` reads each license from the source.
# Vetted from `coursesmith sources discover`: the three guides with the best fit and the highest standing, the RFCs the
# protocol chapters rest on, and the papers the distributed-systems chapters rest on. Left out on purpose: aggregator
# lists of links ("awesome" repos), repositories with no license, and a design system that only shares the word "primer".
sources:
  - name: system-design-primer
    adapter: github
    repo: donnemartin/system-design-primer
    ref: ae9bbd7b02d90b9866215de185217d33f39ab733
    include: ["README.md", "solutions/system_design/**/README.md"]
    exclude: ["**/README-*.md"]        # translations
    title: "System Design Primer"
    depth: 1
    tier: curated                      # license (CC BY 4.0, read from LICENSE.txt) comes from sources/registry.yaml
  - name: singh-system-design
    adapter: github
    repo: karanpratapsingh/system-design
    ref: 6dcea405d41401bfbe4031b6b80f7a2d87b712ba
    include: ["README.md"]
    split: {"README.md": 1}            # the whole course is one file: a page per chapter
    title: "Singh's System Design"
    depth: 1
    tier: curated
  - name: bytebytego-101
    adapter: github
    repo: ByteByteGoHq/system-design-101
    ref: b28380a4710c5ec9638ec037d4168e288f334cba
    include: ["data/guides/*.md", "data/categories/*.md"]
    title: "ByteByteGo System Design 101"
    depth: 0
    tier: curated
  - name: rfcs
    adapter: rfc
    ids: [9110, 9111, 6455, 1034]      # HTTP semantics and caching, WebSocket, DNS concepts
    depth: 0
    tier: standard
  - name: papers
    adapter: paper
    dois:
      - 10.1145/1294261.1294281        # Dynamo: Amazon's highly available key-value store
      - 10.1145/1365815.1365816        # Bigtable: a distributed storage system for structured data
      - 10.1145/945445.945450          # The Google file system
      - 10.1145/1327452.1327492        # MapReduce: simplified data processing on large clusters
      - 10.1145/2491245                # Spanner: Google's globally distributed database
      - 10.1145/1773912.1773922        # Cassandra: a decentralized structured storage system
      - 10.1145/258533.258660          # Consistent hashing and random trees
      - 10.1145/359545.359563          # Time, clocks, and the ordering of events in a distributed system
      - 10.1145/279227.279229          # The part-time parliament (Paxos)
      - 10.1145/564585.564601          # Brewer's conjecture and the feasibility of consistent, available, partition-tolerant web services
      - 10.1145/362686.362692          # Space/time trade-offs in hash coding with allowable errors (Bloom filters)
    depth: 0
    tier: primary

# Wikipedia's maps of the subject do not cover this topic, so there are no hubs or categories: the frame below names
# every chapter and the pages it draws on.
hubs: {}
categories:
  roots: []
  depth: 1
  exclude: []

scope:
  include_terms: [system, design, distributed, database, cache, server, network, latency, scalab, availab, consisten,
                  protocol, queue, replica, shard, partition, throughput, load]
  exclude_terms: [album, film, song, fictional, company, university]
  exclude_desc: []
  person_terms: []
  threshold: null

# per_unit: entries per unit (3-4 because the worked answers are long); the course runs as many units as it needs.
targets:
  per_unit: [3, 4]
  word_ranges: {"Worked example": [300, 700]}
ordering: pedagogical
edition: {images: false, questions: true, proportional_clock: false, paragraphs: false,
          tagline: "System design, one unit a day."}
verification:
  works: openalex
  authorities: []
  units: [ms, µs, s, QPS, req/s, KB, MB, GB, TB, PB, bytes, nodes, replicas]   # capacity math

