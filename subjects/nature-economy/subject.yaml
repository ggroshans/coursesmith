    base: https://eng.libretexts.org/Bookshelves/Environmental_Engineering_(Sustainability_and_Conservation)/Book%3A_Sustainability_-_A_Comprehensive_Foundation_(Cabezas)/06%3A_Environmental_and_Resource_Economics
    selector: ".mt-content-container"
    depth: 2
    tier: curated
    title: "Environmental and Resource Economics (Cabezas)"
    license: {name: "CC BY 4.0", url: "https://creativecommons.org/licenses/by/4.0/"}
  - name: core-the-economy
    adapter: html
    base: https://books.core-econ.org/the-economy/microeconomics/0-4-preface.html
    allow: ["/the-economy/microeconomics/"]
    depth: 2
