slug: nature-economy
title: "Nature and the Economy"
short: nature   # prefix for entry ids: nature-<chapter>-001
description: >-
  How nature supports the economy and how economics can protect nature: ecosystems and the services they
  provide, the economics needed to reason about them (taught from zero, no prior economics assumed), how
  nature is valued and accounted for, the policies and markets that put a price on pollution and pay for
  conservation, natural resource economics, nature-based solutions, climate economics, ecological economics
  and the governance and justice questions that run through all of it. Ordered from foundational to
  advanced, sourced from Wikipedia.

# Pages the crawl always fetches: the subject's main article and anything a course on it must cover.
seeds: [Ecosystem service, Nature-based solutions, Environmental economics, Ecological economics, Natural capital,
        Externality, Market failure, Payment for ecosystem services, Ecosystem valuation, Green infrastructure]

# Sources besides Wikipedia (always on); licenses were read from each source by the search session.
# Left out on purpose: OpenStax Principles of Economics (its terms bar ingestion by language models); Math4Econ (a
# programming notebook, not a course text); IPBES, TEEB, SEEA and IPCC pages could not be fetched or licensed.
sources:
