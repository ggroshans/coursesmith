[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wikicourse"
version = "0.1.0"
description = "Build a complete, sourced, logically ordered course on any subject from Wikipedia."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Garth Groshans Jr"}]
keywords = ["wikipedia", "curriculum", "course", "education", "epub", "knowledge graph"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Text Processing",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/ggroshans/wikicourse"

[project.scripts]
wikicourse = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]
